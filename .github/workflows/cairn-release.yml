name: Cairn release

# A Cairn release is a bare X.Y.Z tag on main. It builds the mod (CoopPrototype) on Windows against the Chairloader revision this project supports
# (CoopPrototype/ChairloaderCompat/base-revision.txt) with the vcpkg baseline of CoopPrototype/vcpkg.json, puts it into a Cairn mod pack
# (.github/cairn/Build-Pack.ps1) and publishes the pack, pack-index.json and game.json: the Cairn launcher reads the index to install and update
# this mod. RELEASE_CHANNEL=beta publishes a pre-release (only players who chose beta are offered it).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-2022   # with its Clang toolset: the project is built with clang-cl, MSVC rejects some lambda captures the code relies on
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: The tag must be on main and equal VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on main" }
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME is not VERSION ($v)" }

      - name: Get the Chairloader revision this mod is built against
        shell: pwsh
        run: |
          $rev = (Get-Content CoopPrototype/ChairloaderCompat/base-revision.txt -TotalCount 1).Trim()
          git clone --filter=blob:none https://github.com/thelivingdiamond/Chairloader chairloader
          git -C chairloader checkout $rev
          if ($LASTEXITCODE -ne 0) { throw "Chairloader $rev is not there" }
          git -C chairloader submodule update --init --depth 1 2>&1 | Out-Host

      # The baseline the manifest pins needs an MSYS2 package (pkgconf) that MSYS2 no longer serves, so the build uses vcpkg's current
      # commit as its baseline: the manifest in this workspace is rewritten (not committed) and the libraries are the versions of that commit.
      - name: Get vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg vcpkg
          $head = (git -C vcpkg rev-parse HEAD).Trim()
          Write-Host "vcpkg baseline: $head"
          $m = Get-Content CoopPrototype/vcpkg.json -Raw | ConvertFrom-Json
          $m.'builtin-baseline' = $head
          $m | ConvertTo-Json -Depth 8 | Set-Content CoopPrototype/vcpkg.json -Encoding utf8
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        shell: pwsh
        run: |
          cmake -S CoopPrototype -B build -A x64 -T ClangCL `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DCHAIRLOADER_COMMON_PATH=$env:GITHUB_WORKSPACE/chairloader/Common"
          if ($LASTEXITCODE -ne 0) { throw 'configuring failed' }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'building failed' }

      - name: Build the pack
        shell: pwsh
        run: |
          $dll = @(Get-ChildItem build -Recurse -Filter CoopPrototype.dll -File | Where-Object { $_.FullName -match 'Release' })
          if ($dll.Count -ne 1) { throw "expected one CoopPrototype.dll, found $($dll.Count)" }
          ./.github/cairn/Build-Pack.ps1 -Dll $dll[0].FullName

      - name: Changelog
        shell: pwsh
        run: ./.github/cairn/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-pack
          path: |
            release/Cairn-Pack-prey-*.zip
            release/pack-index.json
            .github/cairn/game/game.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("release/Cairn-Pack-prey-$env:GITHUB_REF_NAME.zip", 'release/pack-index.json') + (Get-ChildItem .github/cairn/game -File | ForEach-Object { $_.FullName })
          $flags = @()
          if ((Get-Content RELEASE_CHANNEL -Raw).Trim() -eq 'beta') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag @flags
