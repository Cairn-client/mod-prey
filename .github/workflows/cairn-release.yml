name: Cairn release

# A Cairn release is a bare X.Y.Z tag on main. The mod (CoopPrototype) is built the way the project builds it (build-msvc.sh: clang-cl with the Windows
# SDK fetched by xwin, in a container), against the Chairloader revision it supports (CoopPrototype/ChairloaderCompat/base-revision.txt). The DLL goes
# into a Cairn mod pack (.github/cairn/Build-Pack.ps1) and the pack, pack-index.json and game.json are published: the Cairn launcher reads the index
# to install and update this mod. RELEASE_CHANNEL=beta publishes a pre-release (only players who chose beta are offered it).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: The tag must be on main and equal VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
          v="$(head -n1 VERSION | tr -d '\r\n ')"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME is not VERSION ($v)"; exit 1; }

      - name: Get the Chairloader revision this mod is built against
        shell: bash
        run: |
          rev="$(head -n1 CoopPrototype/ChairloaderCompat/base-revision.txt | tr -d '\r\n ')"
          git clone --filter=blob:none https://github.com/thelivingdiamond/Chairloader chairloader
          git -C chairloader checkout "$rev"

      - name: Build the mod
        shell: bash
        env:
          BUILD_JOBS: '1'
        run: |
          CHAIRLOADER_COMMON_PATH="$PWD/chairloader/Common" ./build-msvc.sh
          ls -l CoopPrototype/CoopPrototype.dll

      - uses: actions/upload-artifact@v4
        with:
          name: coopprototype-dll
          path: CoopPrototype/CoopPrototype.dll
          if-no-files-found: error

  pack:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with:
          name: coopprototype-dll
          path: dl

      - name: Build the pack
        shell: pwsh
        run: ./.github/cairn/Build-Pack.ps1 -Dll dl/CoopPrototype.dll

      - name: Changelog
        shell: pwsh
        run: ./.github/cairn/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-pack
          path: |
            release/Cairn-Pack-prey-*.zip
            release/pack-index.json
            .github/cairn/game/game.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("release/Cairn-Pack-prey-$env:GITHUB_REF_NAME.zip", 'release/pack-index.json') + (Get-ChildItem .github/cairn/game -File | ForEach-Object { $_.FullName })
          $flags = @()
          if ((Get-Content RELEASE_CHANNEL -Raw).Trim() -eq 'beta') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag @flags
